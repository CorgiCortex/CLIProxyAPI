name: ZCode isolated preview

on:
  push:
    branches: [feat/zcode-provider]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: zcode-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Provider and integration regression tests
        run: go test ./internal/auth/zcode ./internal/config ./internal/runtime/executor/helps/zcode ./internal/runtime/executor ./sdk/auth ./sdk/cliproxy ./sdk/cliproxy/auth ./sdk/cliproxy/executor -run 'TestZCode|TestSigning|TestLimiter|TestEndpointMapping|TestLoginFlow|TestCredentialResponse|TestProviderAttemptBudget'
      - name: Verification worker tests
        working-directory: tools/zcode-captcha
        run: npm ci && npm test
      - name: Admission and credential concurrency checks
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/runtime/executor/helps/zcode ./internal/auth/zcode ./sdk/cliproxy/executor ./sdk/cliproxy/auth -run 'TestZCode|TestSigning|TestLimiter|TestProviderAttemptBudget|TestEndpointMapping|TestLoginFlow|TestCredentialResponse'
      - name: Compile server
        run: go build -o test-output ./cmd/server && rm test-output
  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: cliproxyapi-zai
            context: .
            file: Dockerfile
          - name: cliproxyapi-zai-captcha
            context: tools/zcode-captcha
            file: tools/zcode-captcha/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/corgicortex/${{ matrix.name }}:sha-${{ github.sha }}
          build-args: |
            VERSION=zcode-preview
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
